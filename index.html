<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d1410">
<title>崩し道場 - 将棋崩し＆ジェンガ</title>
<style>
:root{--ink:#1d1410;--wood:#c98f4e;--gold:#f0c24a;--paper:#f6ead2;--red:#c2331f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);touch-action:none;overscroll-behavior:none;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:700}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 12px 0}
#turn{margin:0 auto 6px;width:fit-content;padding:5px 22px;font-size:20px;letter-spacing:.15em;border-radius:20px;border:2px solid var(--paper);background:#0009}
#turn.me{background:#b8431d;box-shadow:0 0 16px #ff8a40}
.sc{display:flex;justify-content:space-between;align-items:center;font-size:17px;text-shadow:0 1px 3px #000}
.sc b{font-size:30px;color:var(--gold);margin:0 6px}
.meter{height:9px;border:2px solid #f6ead2aa;border-radius:3px;background:#0008;margin-top:5px;overflow:hidden;transform:skewX(-14deg)}
.meter i{display:block;height:100%;width:0}
#mWob i{background:linear-gradient(90deg,#9be07a,#f0c24a,#ff4a2a)}
#mTen i{background:linear-gradient(90deg,#7ab7ff,#b05cff,#ff2a6a)}
.mlabel{font-size:11px;opacity:.8;margin-top:3px;display:flex;justify-content:space-between}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:44px;letter-spacing:.06em;text-shadow:0 0 14px #000,0 4px 0 #000;opacity:0}
#banner.show{animation:banner 1.1s ease-out forwards}
#banner.long{animation:bannerL 2.4s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:scale(2.2)}18%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.95)}}
@keyframes bannerL{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}
#pop{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:40px;color:var(--gold);text-shadow:0 0 8px #000,0 3px 0 #000;opacity:0}
#pop.show{animation:pop .9s ease-out forwards}
#pop.bad{color:#ff6a4d}#pop.big{font-size:56px;color:#fff3b0}
@keyframes pop{0%{opacity:0;transform:translateY(24px) scale(.6)}18%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-40px)}}
#hint{position:absolute;left:0;right:0;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 52px);text-align:center;font-size:14px;opacity:.85;text-shadow:0 1px 3px #000}
.bot{position:absolute;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;pointer-events:auto}
.sm{padding:8px 16px;background:#0009;border:2px solid #f6ead2aa;border-radius:6px;font-size:14px}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;overflow:auto;
  background:radial-gradient(ellipse at 50% 25%,#5a3a2acc,#1d1410f2 78%)}
.logo{font-size:46px;letter-spacing:.1em;line-height:1.1;text-shadow:0 0 18px #c98f4e,0 4px 0 #000;margin:0}
.logo small{display:block;font-size:15px;letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
.btn{width:min(86vw,320px);padding:13px 10px;font-size:19px;background:var(--red);border:3px solid var(--paper);border-radius:6px;box-shadow:0 4px 0 #000;letter-spacing:.1em}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.sub{background:#3a2c24;font-size:16px}
.seg{display:flex;width:min(86vw,320px);border:3px solid var(--paper);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;border:0;background:#3a2c24;font-size:16px}
.seg button.sel{background:var(--gold);color:#222}
.small{font-size:13px;opacity:.85;line-height:1.5;max-width:330px}
.code{font-size:54px;letter-spacing:.2em;color:var(--gold);text-shadow:0 3px 0 #000;font-family:monospace}
input.codein{width:min(86vw,320px);padding:11px;font-size:28px;text-align:center;letter-spacing:.25em;background:#0008;color:var(--gold);border:3px solid var(--paper);border-radius:6px;font-family:monospace;-webkit-user-select:text;user-select:text}
input.name{letter-spacing:.05em;font-family:inherit;font-size:22px}
#err{color:#ff8a70;font-size:14px;min-height:1.3em}
table.rank{border-collapse:collapse;font-size:16px;min-width:240px}
table.rank td{padding:3px 10px;border-bottom:1px solid #f6ead233;text-align:left}
table.rank td:last-child{text-align:right;color:var(--gold)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div id="vig"></div>

<div id="hud" class="hide">
  <div class="top">
    <div id="turn">あなたの番</div>
    <div class="sc"><span>あなた<b id="s1">0</b></span><span id="mid" style="font-size:13px;opacity:.8"></span><span>相手<b id="s2">0</b></span></div>
    <div class="meter" id="mWob"><i></i></div><div class="mlabel"><span>ぐらつき</span><span id="wobTxt"></span></div>
    <div class="meter hide" id="mTen"><i></i></div><div class="mlabel hide" id="tenLbl"><span>緊張度</span><span>高いほど崩れやすい・視野が狭くなる</span></div>
  </div>
  <div id="banner"></div><div id="pop"></div><div id="hint"></div>
  <div class="bot"><button class="sm" id="bView">視点リセット</button><button class="sm" id="bQuit">やめる</button></div>
</div>

<div id="title" class="panel">
  <h1 class="logo"><small>ONLINE ・ ぐいっと引き抜く</small>崩し道場</h1>
  <div class="seg" id="segMode"><button data-v="shogi" class="sel">将棋崩し</button><button data-v="jenga">ジェンガ</button></div>
  <div class="seg" id="segDiff"><button data-v="easy" class="sel">気軽</button><button data-v="real">リアル(緊張)</button></div>
  <div class="small" id="modeHelp"></div>
  <button class="btn" id="bSolo">ひとりで挑戦</button>
  <button class="btn" id="bCreate">部屋をつくって対戦</button>
  <button class="btn" id="bJoin">部屋に入る</button>
  <button class="btn sub" id="bRank">ランキング</button>
  <div id="err"></div>
</div>
<div id="lobby" class="panel hide"><div id="lobbyBody"></div><button class="btn sub" id="bBack">もどる</button></div>
<div id="rankP" class="panel hide"><h2 style="margin:0" id="rankTitle">ランキング</h2><div id="rankBody" class="small">読み込み中…</div><button class="btn sub" id="bRankBack">もどる</button></div>
<div id="result" class="panel hide" style="background:#000b">
  <h1 class="logo" id="resTitle"></h1><div class="small" id="resSub"></div>
  <div id="nameBox" class="hide"><input id="nameIn" class="codein name" maxlength="8" placeholder="なまえ"><button class="btn" id="bSubmit" style="margin-top:8px">ランキングに登録</button></div>
  <button class="btn" id="bAgain">もう一度</button><button class="btn sub" id="bTitle">タイトルへ</button>
</div>
<div id="loading" class="panel" style="z-index:9"><h1 class="logo" style="font-size:26px" id="loadTxt">読み込み中…</h1></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
"rapier":"https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/rapier.mjs"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import RAPIER from "rapier";
await RAPIER.init();

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const GRAV=22;

/* ================= three.js 基本 ================= */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2a1d16);scene.fog=new THREE.Fog(0x2a1d16,22,60);
const camera=new THREE.PerspectiveCamera(48,1,.1,100);
scene.add(new THREE.HemisphereLight(0xfff0d8,0x4a3020,.55));
const sun=new THREE.DirectionalLight(0xffe2b8,2.0);sun.position.set(-4,9,5);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-0.0004;sun.shadow.normalBias=.02;scene.add(sun,sun.target);
const warm=new THREE.PointLight(0xffa860,18,16,1.6);warm.position.set(3,4,3);scene.add(warm);

let gltf=null;
const specs={};          // mode -> [{name,obj,half,off,pos,quat,mats}]
const boards={};         // mode -> {top, box:{c,h}}
const table=new THREE.Mesh(new THREE.CylinderGeometry(16,16,.4,48),new THREE.MeshStandardMaterial({color:0x7a5236,roughness:.85}));
table.receiveShadow=true;scene.add(table);

new GLTFLoader().load('models.glb',g=>{gltf=g;prepare();$('loading').classList.add('hide');initWorld('shogi');},undefined,
  ()=>{$('loadTxt').textContent='モデルを読み込めません';});

function prepare(){
  ['shogi','jenga'].forEach((m,si)=>{
    const sc=gltf.scenes[si];sc.updateMatrixWorld(true);
    const list=[];const bb=new THREE.Box3();let any=false;
    for(const o of sc.children){
      if(o.name.startsWith('Board')){bb.union(new THREE.Box3().setFromObject(o));any=true;o.traverse(x=>{if(x.isMesh){x.castShadow=true;x.receiveShadow=true;}});continue;}
      if(!/^(SHOGI|JENGA)_/.test(o.name))continue;
      const inv=o.matrixWorld.clone().invert(),box=new THREE.Box3(),mats=[];
      o.traverse(d=>{if(d.isMesh){d.geometry.computeBoundingBox();
        box.union(d.geometry.boundingBox.clone().applyMatrix4(inv.clone().multiply(d.matrixWorld)));
        d.material=d.material.clone();d.material.emissive=new THREE.Color(0);d.material.side=THREE.DoubleSide;mats.push(d.material);d.castShadow=true;d.receiveShadow=true;}});
      const size=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());
      const qq=o.quaternion.clone();if(m==='jenga')qq.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2)); // GLBの段向きを直す
      list.push({name:o.name,obj:o,half:size.multiplyScalar(.5),off:c,pos:o.position.clone(),quat:qq,mats});
    }
    specs[m]=list;boards[m]={box:bb.clone(),top:bb.max.y,min:bb.min.y};
  });
}

/* ================= 物理ワールド (Rapier) ================= */
let world=null,W=null,mode='shogi',diff='easy',pieces=[],curScene=null;
let lastSnd=0,curFric=-1,settleSteps=0;
class PBody{
  constructor(rb,mass){this.rb=rb;this.mass=mass;this.position=new THREE.Vector3();this.quaternion=new THREE.Quaternion();
    this.velocity=new THREE.Vector3();this.angularVelocity=new THREE.Vector3();this.sleepState=0;this.world=null;this.colliders=[];}
  pull(){const rb=this.rb,t=rb.translation(),r=rb.rotation(),v=rb.linvel(),a=rb.angvel();
    const dv=Math.hypot(v.x-this.velocity.x,v.y-this.velocity.y,v.z-this.velocity.z);
    this.position.set(t.x,t.y,t.z);this.quaternion.set(r.x,r.y,r.z,r.w);this.velocity.set(v.x,v.y,v.z);this.angularVelocity.set(a.x,a.y,a.z);
    this.sleepState=rb.isSleeping()?2:0;
    if(dv>1.3&&this.world)woodTick(Math.min(1,dv/7));}
  push(){const rb=this.rb,p=this.position,q=this.quaternion;rb.setTranslation({x:p.x,y:p.y,z:p.z},true);rb.setRotation({x:q.x,y:q.y,z:q.z,w:q.w},true);
    rb.setLinvel({x:this.velocity.x,y:this.velocity.y,z:this.velocity.z},true);rb.setAngvel({x:this.angularVelocity.x,y:this.angularVelocity.y,z:this.angularVelocity.z},true);}
  wakeUp(){this.rb.wakeUp();this.sleepState=0;}
  sleep(){this.rb.sleep();this.sleepState=2;}
  accel(ax,ay,az,h){const m=this.mass*h;this.rb.applyImpulse({x:ax*m,y:ay*m,z:az*m},true);}
  dampAng(k){const a=this.rb.angvel();this.rb.setAngvel({x:a.x*k,y:a.y*k,z:a.z*k},true);}
  setFriction(f){for(const c of this.colliders)c.setFriction(f);}
  setHeld(on,f){for(const c of this.colliders){c.setFrictionCombineRule(on?RAPIER.CoefficientCombineRule.Min:RAPIER.CoefficientCombineRule.Average);c.setFriction(on?f:baseFric()*(curFric>0?curFric:1));}}
}
function initWorld(m){
  mode=m;
  if(curScene)scene.remove(curScene);
  curScene=gltf.scenes[m==='shogi'?0:1];scene.add(curScene);
  if(W){try{W.free();}catch(e){}}
  W=new RAPIER.World({x:0,y:-GRAV,z:0});
  W.integrationParameters.numSolverIterations=(window.TUNE&&TUNE.si)||(m==='jenga'?16:8);
  W.integrationParameters.contact_natural_frequency=(window.TUNE&&TUNE.cf)||120;
  W.integrationParameters.numAdditionalFrictionIterations=(window.TUNE&&TUNE.fi)||10;W.integrationParameters.lengthUnit=(window.TUNE&&TUNE.lu)||.25;
  W.timestep=1/120;
  world={
    addBody(b){b.rb.setEnabled(true);b.world=world;b.push();},
    removeBody(b){b.rb.setEnabled(false);b.world=null;},
    step(h){W.timestep=h;W.step();for(const p of pieces)if(p.body.world)p.body.pull();}
  };
  const B=boards[m],bs=B.box.getSize(new THREE.Vector3()),bc=B.box.getCenter(new THREE.Vector3());
  W.createCollider(RAPIER.ColliderDesc.cuboid(bs.x/2,bs.y/2,bs.z/2).setTranslation(bc.x,bc.y,bc.z).setFriction(.6).setRestitution(0));
  W.createCollider(RAPIER.ColliderDesc.cuboid(30,.5,30).setTranslation(0,B.min-.5,0).setFriction(.6));
  table.position.y=B.min-.2;
  const mass=m==='jenga'?1:.5;curFric=-1;
  pieces=specs[m].map((s,i)=>{
    const rb=W.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setLinearDamping(.05).setAngularDamping(.15).setCanSleep(true));
    const sh=.998,vol=8*s.half.x*s.half.y*s.half.z;
    const col=W.createCollider(RAPIER.ColliderDesc.cuboid(s.half.x*sh,s.half.y*sh,s.half.z*sh).setTranslation(s.off.x,s.off.y,s.off.z).setDensity(mass/vol).setFriction(baseFric()).setRestitution(0),rb);
    const body=new PBody(rb,mass);body.colliders.push(col);
    const p={i,s,obj:s.obj,body,state:0,owner:null,tween:null,snapP:new THREE.Vector3(),snapQ:new THREE.Quaternion(),netP:new THREE.Vector3(),netQ:new THREE.Quaternion(),glow:0,long:s.half.x>=s.half.z?0:2,layer:Math.floor(i/3)};
    return p;
  });
  placeAll();
  sun.shadow.camera.left=-7;sun.shadow.camera.right=7;sun.shadow.camera.top=7;sun.shadow.camera.bottom=-7;sun.shadow.camera.far=40;sun.shadow.camera.updateProjectionMatrix();
  sun.position.set(-4,12,6);sun.target.position.set(0,1,0);
  setCamPreset(true);
}
const baseFric=()=>(window.TUNE&&TUNE.fr)||(mode==='jenga'?.3:.5);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function placeAll(){
  const R=rng((Math.random()*1e9)|0),order=pieces.map((_,i)=>i).sort(()=>R()-.5);
  const e=new THREE.Euler(),q=new THREE.Quaternion();
  for(const p of pieces){
    const b=p.body;
    if(mode==='shogi'){ // 将棋崩し: 駒をばらまいて山をつくる
      const k=order.indexOf(p.i);
      b.position.set((R()-.5)*.8,.6+k*.17,(R()-.5)*.8);
      e.set((R()-.5)*.5,R()*6.283,(R()-.5)*.5);q.setFromEuler(e);b.quaternion.copy(q);
    }else{b.position.set(p.s.pos.x,p.s.pos.y,p.s.pos.z);b.quaternion.copy(p.s.quat);}
    b.velocity.set(0,0,0);b.angularVelocity.set(0,0,0);
    b.rb.setEnabled(true);b.world=world;b.push();b.wakeUp();
    p.state=0;p.owner=null;p.tween=null;p.obj.scale.setScalar(1);p.obj.visible=true;
  }
  W.integrationParameters.lengthUnit=(window.TUNE&&TUNE.pl)||.25;const n=mode==='shogi'?900:120;
  for(let i=0;i<n;i++){W.timestep=1/120;W.step();}
  for(let i=0;i<2400;i++){W.timestep=1/120;W.step();if(i%20===0){let mv=0;for(const p of pieces){const v=p.body.rb.linvel(),a=p.body.rb.angvel();mv=Math.max(mv,Math.hypot(v.x,v.y,v.z)+.3*Math.hypot(a.x,a.y,a.z));}settleSteps=i;if(mv<.012)break;}}
  W.integrationParameters.lengthUnit=(window.TUNE&&TUNE.lu)||.25;
  for(const p of pieces){p.body.pull();p.body.velocity.set(0,0,0);p.body.rb.setLinvel({x:0,y:0,z:0},true);p.body.rb.setAngvel({x:0,y:0,z:0},true);p.body.sleep();}
  syncMeshes();
}
function syncMeshes(){for(const p of pieces){if(p.tween||p.state===1||p.state===2)continue;p.obj.position.copy(p.body.position);p.obj.quaternion.copy(p.body.quaternion);}}
/* ================= カメラ ================= */
const cam={yaw:0,pitch:.95,dist:7.5,tx:0,ty:.5,tz:0,dTarget:7.5,tyT:.5,shake:0,push:0};
function setCamPreset(snap){
  if(mode==='shogi'){cam.pitch=1.05;cam.dTarget=6.8;cam.tyT=.4;}else{cam.pitch=.5;cam.dTarget=14.5;cam.tyT=2.3;}
  cam.yaw=0;if(snap){cam.dist=cam.dTarget;cam.ty=cam.tyT;}
}
function updateCam(dt){
  cam.dist=lerp(cam.dist,cam.dTarget*(1-cam.push*.35),Math.min(1,dt*5));cam.ty=lerp(cam.ty,cam.tyT,Math.min(1,dt*3));
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const sh=cam.shake;
  camera.position.set(cam.tx+Math.sin(cam.yaw)*cp*cam.dist+(Math.random()-.5)*sh,cam.ty+sp*cam.dist+(Math.random()-.5)*sh,cam.tz+Math.cos(cam.yaw)*cp*cam.dist);
  camera.lookAt(cam.tx,cam.ty,cam.tz);cam.shake=Math.max(0,sh-dt*1.2);
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<.8?58:46;camera.updateProjectionMatrix();
  const fx=$('fx');fx.width=w;fx.height=h;}
addEventListener('resize',resize);resize();

/* ================= ゲーム状態 ================= */
let phase='title';           // title lobby play handover over
let solo=true,online=false,isHost=true,myRole='H';
let turn='me',authority=true;
let held=null;               // 掴み中
let tension=0,wobble=0,combo=0,score=0,bestWob=0;
let takenN={me:0,op:0};
let calmT=0,turnEnding=null,failed=false,placing=null,waitT=0,timeScale=1,slowT=0,tAll=0,sinceSnap=0;
const THR=()=>mode==='shogi'?(diff==='real'?{p:.06,a:.2}:{p:.12,a:.35}):{p:.4,a:.6,y:.16};
const real=()=>diff==='real';

function startMatch(snap){
  initWorld(cfgMode);diff=cfgDiff;if(snap)loadSnap(snap);
  phase='play';held=null;tension=0;combo=0;score=0;takenN={me:0,op:0};failed=false;turnEnding=null;placing=null;timeScale=1;
  $('title').classList.add('hide');$('lobby').classList.add('hide');$('result').classList.add('hide');$('rankP').classList.add('hide');$('hud').classList.remove('hide');
  $('mTen').classList.toggle('hide',!real());$('tenLbl').classList.toggle('hide',!real());
  turn=solo||isHost?'me':'op';authority=turn==='me';
  if(authority)snapshotRest();
  updHud();
  $('hint').textContent=mode==='shogi'?'駒をつまんで、山から静かに引き離そう':'ブロックをつまんで、横に引き抜こう (上の段はNG)';
  setTimeout(()=>{if(phase==='play')$('hint').textContent='';},7000);
  banner(turn==='me'?'あなたの番':'相手の番');
}
function snapshotRest(){
  for(const p of pieces){p.snapP.copy(p.body.position);p.snapQ.copy(p.body.quaternion);}
  sinceSnap=0;
}

const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();

      else if(p){$('hint').textContent='そのブロックは抜けません(上の段)';setTimeout(()=>$('hint').textContent='',1500);sfx('no');}
    }
  }

/* ---- 掴んで引く ---- */
function startGrab(p,pt,pid){
  const b=p.body;b.wakeUp();
  const loc=pt.clone().sub(b.position).applyQuaternion(b.quaternion.clone().invert());
  held={p,local:loc,planeY:pt.y,y0:b.position.y,hit0:pt.clone(),sx:ptrs.get(pid).x,sy:ptrs.get(pid).y,c0:new THREE.Vector3().copy(b.position),axis:null,out:0,t:0,safeFlag:false};
  if(mode==='jenga'){const q=new THREE.Quaternion().copy(b.quaternion);const ax=new THREE.Vector3(p.long===0?1:0,0,p.long===2?1:0).applyQuaternion(q);ax.y=0;ax.normalize();held.axis=ax;}
  p.glow=1;b.setHeld(true,mode==='jenga'?((window.TUNE&&TUNE.hf!==undefined)?TUNE.hf:(real()?.12:.06)):((window.TUNE&&TUNE.hs!==undefined)?TUNE.hs:.18));sfx('grab');vib(8);
  if(online)send({t:'h',i:p.i});
}
function release(){
  if(!held)return;const p=held.p;held=null;p.glow=0;
  p.body.setHeld(false);if(online)send({t:'h',i:-1});
  if(!p.body.world||p.state!==0)return;
  p.snapP.copy(p.body.position);p.snapQ.copy(p.body.quaternion);
}
function holdForce(dt){
  if(!held)return;const p=held.p,b=p.body;if(p.state!==0){held=null;return;}
  b.wakeUp();held.t+=dt;
  const tgt=held.tgtOverride?held.tgtOverride.clone():rayPlaneY(held.sx,held.sy,held.planeY);if(!tgt)return;
  const tr=real()?tension*.025:0;
  if(tr>0){tgt.x+=Math.sin(tAll*17.3)*tr+Math.sin(tAll*29.1)*tr*.6;tgt.z+=Math.cos(tAll*19.7)*tr+Math.sin(tAll*31.3)*tr*.6;}
  const m=b.mass;
  if(mode==='shogi'){
    const gp=held.local.clone().applyQuaternion(b.quaternion).add(b.position);
    let ax=tgt.x-gp.x,az=tgt.z-gp.z;
    const vx=b.velocity.x,vz=b.velocity.z;
    let fx=95*ax-17*vx,fz=95*az-17*vz;const L=Math.hypot(fx,fz),MAXA=(window.TUNE&&TUNE.ma)||38;if(L>MAXA){fx*=MAXA/L;fz*=MAXA/L;}
    {const gy=b.position.y+held.local.y*0,ty=(window.TUNE&&TUNE.lift!==undefined?TUNE.lift:.05);const ay=GRAV*((window.TUNE&&TUNE.gw!==undefined)?TUNE.gw:1)+70*(held.y0+ty-gy)-16*b.velocity.y;b.accel(fx,clamp(ay,-30,60),fz,dt);}
    b.dampAng(1-Math.min(.9,9*dt));
    held.sp=Math.hypot(vx,vz);
  }else{
    const a=held.axis;
    const s=(b.position.x-held.c0.x)*a.x+(b.position.z-held.c0.z)*a.z;
    const st=clamp((tgt.x-held.hit0.x)*a.x+(tgt.z-held.hit0.z)*a.z,-1.8,1.8);
    const va=b.velocity.x*a.x+b.velocity.z*a.z;
    const JMA=(window.TUNE&&TUNE.jma)||600,vt=clamp(3*(st-s),-(window.TUNE&&TUNE.vm||1.1),(window.TUNE&&TUNE.vm||1.1));let acc=clamp(80*(vt-va),-JMA,JMA);
    const lx=b.velocity.x-a.x*va,lz=b.velocity.z-a.z*va;
    b.accel(acc*a.x-12*lx,0,acc*a.z-12*lz,dt);
    b.dampAng(1-Math.min(.95,14*dt));

  }
}

/* ================= ルール ================= */
function qAngle(a,b){return 2*Math.acos(Math.min(1,Math.abs(a.x*b.x+a.y*b.y+a.z*b.z+a.w*b.w)));}
const _q=new THREE.Quaternion();
function checkRules(dt){
  const th=THR();let maxR=0;
  for(const p of pieces){
    if(p.state!==0||(held&&held.p===p)||(placing&&placing.p===p&&!placing.done))continue;
    const bp=p.body.position,dx=bp.x-p.snapP.x,dy=bp.y-p.snapP.y,dz=bp.z-p.snapP.z;
    _q.set(p.body.quaternion.x,p.body.quaternion.y,p.body.quaternion.z,p.body.quaternion.w);
    const ang=qAngle(_q,p.snapQ);let r;
    if(mode==='shogi')r=Math.max(Math.hypot(dx,dy,dz)/th.p,ang/th.a);
    else r=Math.max(Math.hypot(dx,dz)/th.p,-dy/th.y,ang/th.a);
    // 隣接ブロックのわずかな沈みは許容(ジェンガ)
    if(mode==='jenga')r*=1;
    p.glow=Math.max(p.glow>=1&&held&&held.p===p?1:0,clamp((r-.35)/.65,0,1)*.9);
    if(r>maxR)maxR=r;
  }
  wobble=maxR;
  if(maxR>=1&&!turnEnding&&!placing&&!failed)onFail();
  // 将棋: 掴んでいる駒が山から離れたら取得
  if(mode==='shogi'&&held&&!turnEnding){
    const p=held.p,bp=p.body.position;let ok=true;
    for(const q of pieces){if(q===p||q.state!==0)continue;
      if(Math.hypot(q.body.position.x-bp.x,q.body.position.z-bp.z)<.62&&Math.abs(q.body.position.y-bp.y)<.5){ok=false;break;}}
    if(ok&&held.t>.15)capture(p,'me');
  }
  // 盤外へ落ちた駒
  for(const p of pieces){if(p.state===0&&p.body.position.y<boards[mode].top-.12&&(Math.abs(p.body.position.x)>2.35||Math.abs(p.body.position.z)>2.35)){if(held&&held.p===p)release();p.state=3;p.glow=0;}}
}
function capture(p,who){
  if(p.state!==0)return;release();
  p.state=who==='me'?1:2;p.owner=who;

    combo++;const add=100+60*(combo-1);score+=add;tension=Math.max(0,tension-.18);
    sfx('pop');vib(15);
    const names=['','スポッ!','お見事!','連続!','神業!','達人!','伝説!!','鬼!!'];pop(names[Math.min(combo,7)]+(combo>1?` ×${combo}`:''),combo>=3?'big':'');

function trayPos(p,who){

function onFail(){

/* ---- ジェンガ: 配置 ---- */
const layerH=()=>specs.jenga[3].pos.y-specs.jenga[0].pos.y;
const layerOf=p=>p.layer;
function topLayer(){let m=0;for(const p of pieces)if(p.state===0&&(!placing||placing.p!==p)&&(!(held&&held.p===p))){m=Math.max(m,layerOf(p));}return m;}
function layerCount(L){return pieces.filter(p=>p.state===0&&(!held||held.p!==p)&&(!placing||placing.p!==p)&&layerOf(p)===L).length;}
function jengaLayers(){return topLayer()+1;}
function startPlace(p){
  // 抜き終わり → 一番上へ載せる
  const top=topLayer(),cnt=layerCount(top);let L=cnt>=3?top+1:top;
  const parity=L%2,offs=[-.345,0,.345];let slot=0;
  const used=pieces.filter(q=>q!==p&&q.state===0&&layerOf(q)===L).map(q=>parity===0?q.body.position.x:q.body.position.z);
  slot=offs.find(o=>!used.some(u=>Math.abs(u-o)<.17));if(slot===undefined)slot=0;
  const inL=pieces.filter(q=>q!==p&&q.state===0&&q.layer===(cnt>=3?top:L));const avgY=inL.reduce((s,q)=>s+q.body.position.y,0)/Math.max(1,inL.length);const y=(cnt>=3?avgY+layerH():avgY)+.02;p.layer=L;

  const b=p.body;b.position.set(to.x,to.y,to.z);b.quaternion.set(q.x,q.y,q.z,q.w);b.velocity.set(0,0,0);b.angularVelocity.set(0,0,0);world.addBody(b);b.wakeUp();

/* ================= 雑多(演出) ================= */
function confetti(n){
  const cols=['#f0c24a','#e8503a','#fff3d0','#7ac0ff','#8fe07a'];
  for(let i=0;i<n;i++)fxp.push({x:Math.random()*innerWidth,y:-10-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:10+Math.random()*8,c:cols[i%cols.length],life:2.2});
}
const fxp=[];const fxc=$('fx').getContext('2d');
function drawFx(dt){
  const w=innerWidth,h=innerHeight;fxc.clearRect(0,0,w,h);
  for(let i=fxp.length-1;i>=0;i--){const p=fxp[i];p.life-=dt;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vy+=.05;
    if(p.life<=0||p.y>h+20){fxp.splice(i,1);continue;}
    fxc.save();fxc.translate(p.x,p.y);fxc.rotate(p.r);fxc.globalAlpha=Math.min(1,p.life);fxc.fillStyle=p.c;fxc.fillRect(-p.w/2,-p.h/2,p.w,p.h);fxc.restore();}

function endGame(reason,winnerOverride){

const bestKey=()=>`kz_best_${mode}_${diff}`;
const bestGet=()=>+(localStorage.getItem(bestKey())||0);const bestSet=v=>localStorage.setItem(bestKey(),v);

/* ================= メインループ ================= */
function step(dtReal){
  tAll+=dtReal;
  if(slowT>0){slowT-=dtReal;timeScale=lerp(timeScale,.18,.2);if(slowT<=0)timeScale=1;}else timeScale=lerp(timeScale,1,.1);
  const dt=Math.min(dtReal,1/20)*timeScale;
  const live=(phase==='play'||phase==='handover'||phase==='over');
  if(live&&authority&&world){
    simAcc=Math.min(simAcc+dt,8/120);
    while(simAcc>=1/120){holdForce(1/120);world.step(1/120);simAcc-=1/120;}
    syncMeshes();
    if(phase==='play'){
      checkRules(dt);
      // 静止判定
      const moving=pieces.some(p=>p.state===0&&p.body.sleepState!==2&&(p.body.velocity.lengthSq()>.004||p.body.angularVelocity.lengthSq()>.04));
      calmT=moving||held?0:calmT+dt;
      if(!held&&!placing&&!turnEnding&&calmT>.6&&sinceSnap>0)snapshotRest();
      sinceSnap+=dt;
      // ジェンガ: 載せ終わり→静止待ち
      if(placing&&placing.done){waitT+=dt;if(calmT>.7&&waitT>.8){const p=placing.p;placing=null;snapshotRest();onBlockDone(p);}}
      if(turnEnding==='fail'){waitT+=dt;if(calmT>.5||waitT>2.5){const te=turnEnding;turnEnding=null;waitT=0;afterFail();}}
      if(online)netStream(dtReal);
    }
    if(phase==='over'&&online)netStream(dtReal);
  }else if(live&&!authority){
    for(const p of pieces){if(p.state===0||p.state===3){p.obj.position.lerp(p.netP,Math.min(1,dtReal*14));p.obj.quaternion.slerp(p.netQ,Math.min(1,dtReal*14));}}
  }
  // トゥイーン
  for(const p of pieces){const t=p.tween;if(!t)continue;t.t+=dtReal;const k=Math.min(1,t.t/t.dur),e=k*k*(3-2*k);
    p.obj.position.lerpVectors(t.from,t.to,e);p.obj.position.y+=Math.sin(k*Math.PI)*t.arc;p.obj.quaternion.slerpQuaternions(t.fq,t.tq,e);
    if(k>=1){const pl=t.place;p.tween=null;if(pl&&placing&&placing.p===p)finishPlace();else{p.obj.position.copy(t.to);}}}
  // 緊張度
  if(real()&&phase==='play'&&turn==='me'){
    if(held){tension+=dtReal*(.03+.25*clamp(wobble,0,1.2)+.02*Math.min(2,held.sp||0));}
    else tension-=dtReal*.04;
    tension=clamp(tension,0,1);
    if(tension>.45&&tAll>nextBeat){heartbeat(tension);nextBeat=tAll+1.1-.6*tension;}
  }else if(!real())tension=0;
  const fr=real()?1-.38*tension:1;if(world&&real()&&Math.abs(fr-curFric)>.03){curFric=fr;for(const p of pieces)p.body.setFriction(baseFric()*fr);}
  // 発光(ぐらつき警告)
  for(const p of pieces){let g=p.glow;if(held&&held.p===p)g=1;if(g!==p._g){p._g=g;
    const gold=held&&held.p===p;for(const m of p.s.mats)m.emissive.setRGB(gold?.35:g*.9,gold?.25:g*.08,gold?0:g*.04);}
    if(p.glow>0&&!(held&&held.p===p))p.glow*=.92;}
  // HUD
  $('mWob').firstElementChild.style.width=(clamp(wobble,0,1)*100)+'%';$('wobTxt').textContent=wobble>.75?'あぶない!':wobble>.4?'ぐらぐら…':'';
  if(real())$('mTen').firstElementChild.style.width=(tension*100)+'%';
  const v=real()?tension:0;$('vig').style.opacity=v>0.02?1:0;if(v>.02)$('vig').style.background=`radial-gradient(circle at 50% 52%,transparent ${Math.round(70-v*52)}%,rgba(10,0,0,${(.35+v*.65).toFixed(2)}) 100%)`;
  riserUpdate(phase==='play'&&turn==='me'&&held?wobble:0);
  if(phase==='title'||phase==='lobby'||phase==='result'||phase==='rank'){cam.yaw+=dtReal*.12;}
  if(mode==='jenga'&&phase!=='title'){cam.tyT=1.3+Math.max(1.2,(topLayer()+1)*layerH()*.5);}
  updateCam(dtReal);drawFx(dtReal);
  if(!window.NOREND)renderer.render(scene,camera);
}

  sfx('pop');sfx('chime',Math.min(5,combo));vib(20);pop(['','のせた!','お見事!','連続!','神業!'][Math.min(combo,4)]+` ${jengaLayers()}段`,combo>=3?'big':'');

function afterFail(){ // 将棋: 失敗→手番交代
  combo=0;
  if(solo){endGame('fail');return;}
  passTurn();
}
function passTurn(){
  authority=false;phase='play';turn='op';held=null;failed=false;combo=0;
  send({t:'turn',snap:buildSnap(),sc:takenN});
  banner('相手の番');updHud();
}
function buildSnap(){return pieces.map(p=>[p.i,p.state,+p.body.position.x.toFixed(4),+p.body.position.y.toFixed(4),+p.body.position.z.toFixed(4),
  +p.body.quaternion.x.toFixed(4),+p.body.quaternion.y.toFixed(4),+p.body.quaternion.z.toFixed(4),+p.body.quaternion.w.toFixed(4),p.layer]);}
function loadSnap(snap,flip){
  for(const a of snap){const p=pieces[a[0]];p.state=flip&&(a[1]===1||a[1]===2)?3-a[1]:a[1];if(a[9]!==undefined&&mode==='jenga')p.layer=a[9];
    p.body.position.set(a[2],a[3],a[4]);p.body.quaternion.set(a[5],a[6],a[7],a[8]);p.body.velocity.set(0,0,0);p.body.angularVelocity.set(0,0,0);
    p.obj.position.set(a[2],a[3],a[4]);p.obj.quaternion.set(a[5],a[6],a[7],a[8]);p.netP.set(a[2],a[3],a[4]);p.netQ.set(a[5],a[6],a[7],a[8]);p.tween=null;
    if(p.state===1||p.state===2){if(p.body.world)world.removeBody(p.body);const tp=trayPos(p,p.state===1?'me':'op');p.obj.position.copy(tp);p.obj.quaternion.setFromEuler(new THREE.Euler(0,p.state===1?0:Math.PI,0));}
    else{if(!p.body.world)world.addBody(p.body);else p.body.push();p.body.sleep();}}
}

/* ================= ネットワーク ================= */
let peer=null,conn=null,againMe=false,againOp=false,cfgMode='shogi',cfgDiff='easy',streamT=0;
function send(m){if(online&&conn&&conn.open)conn.send(m);}
function netStream(dt){
  streamT+=dt;if(streamT<.05)return;streamT=0;
  const a=[];for(const p of pieces){if(p.state===1||p.state===2||p.tween)continue;const b=p.body;
    if(b.sleepState===2&&!(held&&held.p===p))continue;
    a.push([p.i,+b.position.x.toFixed(3),+b.position.y.toFixed(3),+b.position.z.toFixed(3),+b.quaternion.x.toFixed(3),+b.quaternion.y.toFixed(3),+b.quaternion.z.toFixed(3),+b.quaternion.w.toFixed(3)]);}
  // 載せ中のブロックも
  if(placing&&placing.p.tween){const p=placing.p;a.push([p.i,+p.obj.position.x.toFixed(3),+p.obj.position.y.toFixed(3),+p.obj.position.z.toFixed(3),+p.obj.quaternion.x.toFixed(3),+p.obj.quaternion.y.toFixed(3),+p.obj.quaternion.z.toFixed(3),+p.obj.quaternion.w.toFixed(3)]);}
  if(a.length)send({t:'xf',a});
}
let heldOp=-1;
function onNet(m){
  switch(m.t){
    case 'cfg':cfgMode=m.mode;cfgDiff=m.diff;startMatch(m.snap);break;
    case 'xf':
      for(const a of m.a){const p=pieces[a[0]];if(!p)continue;
        if(p.state===0||p.state===3){
          const d=Math.abs(a[1]-p.netP.x)+Math.abs(a[2]-p.netP.y)+Math.abs(a[3]-p.netP.z);
          if(d>.02)woodTick(Math.min(.6,d*3));
          p.netP.set(a[1],a[2],a[3]);p.netQ.set(a[4],a[5],a[6],a[7]);}}
      break;
    case 'h':if(heldOp>=0&&pieces[heldOp])pieces[heldOp].glow=0;heldOp=m.i;if(m.i>=0){pieces[m.i].glow=1;}break;
    case 'cap':{const p=pieces[m.i];if(p&&p.state===0){heldOp=-1;p.state=2;p.owner='op';takenN.op++;trayTween(p,'op');sfx('pop');updHud();if(playing().length===0)setTimeout(()=>endGame('clear'),700);}break;}
    case 'pl':{sfx('tick');break;}
    case 'fx':if(m.k==='fail'){sfx('fail');pop('相手が崩した!','big');cam.shake=.2;}
      else if(m.k==='collapse'){phase='over';slowT=1.8;cam.push=1;cam.shake=.5;sfx('collapse');banner('崩壊!',true);setTimeout(()=>endGame('collapse'),2400);}
      break;
    case 'turn':
      loadSnap(m.snap,true);takenN={me:m.sc.op,op:m.sc.me};turn='me';authority=true;phase='play';failed=false;combo=0;placing=null;turnEnding=null;held=null;heldOp=-1;
      snapshotRest();calmT=0;updHud();banner('あなたの番');sfx('chime',1);vib(30);break;
    case 'again':againOp=true;checkAgain();break;
    case 'go':startMatch();break;
    case 'quit':lostConn(true);break;
  }
}
function checkAgain(){
  if(solo){startMatch();return;}
  if(againMe&&againOp){if(isHost){startMatch();send({t:'cfg',mode:cfgMode,diff:cfgDiff,snap:buildSnap()});}}
  else $('resSub').textContent=againMe?'相手の返事を待っています…':'相手が再戦を待っています';
}
const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const rcode=()=>Array.from({length:5},()=>CH[Math.floor(Math.random()*CH.length)]).join('');
function netClose(){try{conn&&conn.close();}catch(e){}try{peer&&peer.destroy();}catch(e){}conn=peer=null;online=false;}
function createRoom(){
  netClose();const code=rcode();isHost=true;online=true;solo=false;myRole='H';
  showLobby(`<div class="small">ともだちにこのコードを教えるか<br>リンクを送ろう</div><div class="code">${code}</div>
   <button class="btn" id="bShare">リンクを送る</button><div class="small">相手を待っています…</div>`);
  const link=location.origin+location.pathname+'?room='+code;
  $('bShare').onclick=()=>{const d={title:'崩し道場',text:'将棋崩し・ジェンガで勝負!',url:link};
    if(navigator.share)navigator.share(d).catch(()=>{});else navigator.clipboard&&navigator.clipboard.writeText(link).then(()=>$('bShare').textContent='コピーしました');};
  peer=new Peer('kzdojo-'+code);
  peer.on('connection',c=>{if(conn){c.close();return;}setConn(c);});
  peer.on('error',e=>{if(e.type==='unavailable-id')createRoom();else lobbyErr('サーバーに接続できません ('+e.type+')');});
}
function joinRoom(code){
  netClose();isHost=false;online=true;solo=false;myRole='G';
  showLobby('<div class="small">接続中…</div>');
  peer=new Peer();const to=setTimeout(()=>lobbyErr('つながりませんでした。コードを確認してね'),15000);
  peer.on('open',()=>{const c=peer.connect('kzdojo-'+code,{reliable:true});setConn(c,to);});
  peer.on('error',e=>{clearTimeout(to);lobbyErr(e.type==='peer-unavailable'?'その部屋は見つかりません':'接続エラー ('+e.type+')');});
}
function setConn(c,to){
  conn=c;
  const opened=()=>{if(to)clearTimeout(to);if(isHost){startMatch();send({t:'cfg',mode:cfgMode,diff:cfgDiff,snap:buildSnap()});}};
  if(c.open)opened();else c.on('open',opened);
  c.on('data',onNet);c.on('close',()=>{if(online&&phase!=='title')lostConn();});c.on('error',()=>{if(online&&phase!=='title')lostConn();});
}
function lostConn(quit){banner(quit?'相手が退出しました':'接続が切れました',true);online=false;setTimeout(toTitle,1800);}
function showLobby(html){$('title').classList.add('hide');$('lobby').classList.remove('hide');$('lobbyBody').innerHTML=html;phase='lobby';}
function lobbyErr(t){$('lobbyBody').innerHTML=`<div class="small" style="color:#ff8a70;font-size:16px">${t}</div>`;}
function toTitle(){
  netClose();solo=true;phase='title';held=null;
  ['hud','lobby','result','rankP'].forEach(i=>$(i).classList.add('hide'));$('title').classList.remove('hide');$('vig').style.opacity=0;
  initWorld(cfgMode);diff=cfgDiff;
}
function showJoin(pre=''){
  showLobby(`<div class="small">ともだちから聞いたコードを入力</div><input id="cin" class="codein" maxlength="5" value="${pre}" autocomplete="off" style="text-transform:uppercase"><button class="btn" id="bGo">対戦する!</button>`);
  const go=()=>{const c=$('cin').value.trim().toUpperCase();if(c.length===5)joinRoom(c);};
  $('bGo').onclick=go;$('cin').addEventListener('keydown',e=>{if(e.key==='Enter')go();});if(pre.length===5)setTimeout(go,50);
}

/* ================= ランキング (ntfy.sh 公開トピック / 12時間保持) ================= */
const topic=()=>`kuzushi-dojo-rank-v1-${cfgMode}-${cfgDiff}`;
async function rankPost(name,sc){
  try{await fetch('https://ntfy.sh/'+topic(),{method:'POST',body:JSON.stringify({n:name,s:sc})});return true;}catch(e){return false;}
}
async function rankGet(){
  const r=await fetch(`https://ntfy.sh/${topic()}/json?poll=1&since=12h`);const txt=await r.text();const out=[];
  for(const line of txt.split('\n')){if(!line.trim())continue;try{const m=JSON.parse(line);if(m.event!=='message')continue;const d=JSON.parse(m.message);
    if(typeof d.s==='number'&&d.s>0&&d.s<200000&&typeof d.n==='string')out.push({n:d.n.slice(0,8),s:Math.floor(d.s)});}catch(e){}}
  out.sort((a,b)=>b.s-a.s);return out.slice(0,10);
}
async function showRank(){
  $('title').classList.add('hide');$('result').classList.add('hide');$('rankP').classList.remove('hide');
  $('rankTitle').textContent=`${cfgMode==='shogi'?'将棋崩し':'ジェンガ'} ${cfgDiff==='real'?'リアル':'気軽'}`;
  $('rankBody').textContent='読み込み中…';
  try{const l=await rankGet();
    const best=+(localStorage.getItem(`kz_best_${cfgMode}_${cfgDiff}`)||0);
    $('rankBody').innerHTML=(l.length?`<table class="rank">${l.map((r,i)=>`<tr><td>${i+1}</td><td></td><td>${r.s}</td></tr>`).join('')}</table>`:'まだ記録がありません')+
      `<div style="margin-top:10px">あなたの自己ベスト: ${best}</div><div style="opacity:.6;margin-top:6px">※直近12時間のランキングです</div>`;
    $('rankBody').querySelectorAll('tr').forEach((tr,i)=>tr.children[1].textContent=l[i].n);
  }catch(e){$('rankBody').textContent='ランキングに接続できません';}
}

/* ================= UI ================= */
const helps={shogi:'山から駒を1枚ずつ、他の駒を動かさずに引き抜く。連続成功でコンボ!',jenga:'タワーからブロックを抜いて一番上へ。崩したら負け!'};
function setSeg(id,val,cb){document.querySelectorAll(`#${id} button`).forEach(b=>{b.classList.toggle('sel',b.dataset.v===val);b.onclick=()=>{initAudio();cb(b.dataset.v);};});}
function refreshSeg(){setSeg('segMode',cfgMode,v=>{cfgMode=v;refreshSeg();if(phase==='title')initWorld(v);});setSeg('segDiff',cfgDiff,v=>{cfgDiff=v;diff=v;refreshSeg();});
  $('modeHelp').textContent=helps[cfgMode]+(cfgDiff==='real'?' 【リアル】ミスが続くと緊張が高まり、視野が狭く、崩れやすくなる!':'');}
refreshSeg();
$('bSolo').onclick=()=>{initAudio();solo=true;online=false;isHost=true;startMatch();};
$('bCreate').onclick=()=>{initAudio();createRoom();};
$('bJoin').onclick=()=>{initAudio();showJoin();};
$('bRank').onclick=()=>{phase='rank';showRank();};
$('bRankBack').onclick=()=>{$('rankP').classList.add('hide');$('title').classList.remove('hide');phase='title';};
$('bBack').onclick=toTitle;$('bTitle').onclick=toTitle;
$('bQuit').onclick=()=>{send({t:'quit'});toTitle();};
$('bView').onclick=()=>setCamPreset(false);
$('bAgain').onclick=()=>{if(solo){startMatch();return;}againMe=true;send({t:'again'});checkAgain();};
$('bSubmit').onclick=async()=>{const n=($('nameIn').value.trim()||'名無し').slice(0,8);localStorage.setItem('kz_name',n);$('bSubmit').disabled=true;$('bSubmit').textContent='送信中…';
  const ok=await rankPost(n,score);$('bSubmit').textContent=ok?'登録しました!':'送信できませんでした';if(ok){phase='rank';showRank();}};
const qr=new URLSearchParams(location.search).get('room');if(qr&&qr.length===5)setTimeout(()=>showJoin(qr.toUpperCase()),0);

/* ================= サウンド ================= */
let AC=null,riser=null,riserG=null;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
  riser=AC.createOscillator();riserG=AC.createGain();riser.type='sawtooth';riser.frequency.value=180;riserG.gain.value=0;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=700;riser.connect(f).connect(riserG).connect(AC.destination);riser.start();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();}
function riserUpdate(w){if(!AC||!riserG)return;const t=AC.currentTime;const g=w>.45?(w-.45)*(w-.45)*.5:0;riserG.gain.setTargetAtTime(Math.min(.1,g),t,.08);riser.frequency.setTargetAtTime(160+w*340,t,.1);}
function tone(f0,f1,dur,type='sine',vol=.2,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur);}
function noise(dur,vol=.2,f0=3000,f1=800,type='bandpass'){if(!AC)return;const t=AC.currentTime,n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;
  const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);}
function woodTick(v){if(!AC)return;const t=performance.now();if(t-lastSnd<28)return;lastSnd=t;
  const f=500+Math.random()*500;tone(f*1.5,f*.7,.07,'triangle',.05+.22*v);noise(.04,.05+.15*v,2400,900);}
function heartbeat(T){tone(70,38,.2,'sine',.35*T);tone(62,35,.22,'sine',.28*T,.17);vib(12);}
function sfx(k,n=1){if(!AC)return;
  if(k==='grab'){tone(300,220,.06,'triangle',.12);noise(.05,.08,3000,1200);}
  else if(k==='pop'){tone(260,900,.12,'sine',.28);noise(.06,.15,4000,1500);}
  else if(k==='chime'){const base=[0,523,587,659,784,880,988,1175][Math.min(n,7)]||523;tone(base,base,.4,'triangle',.14);tone(base*1.5,base*1.5,.35,'sine',.1,.08);tone(base*2,base*2,.3,'sine',.07,.16);}
  else if(k==='taiko'){tone(120,50,.35,'sine',.55);noise(.12,.3,500,200);tone(90,45,.4,'sine',.5,.18);}
  else if(k==='fail'){tone(200,80,.4,'sawtooth',.2);noise(.25,.25,800,200);}
  else if(k==='collapse'){noise(1.6,.7,900,90,'lowpass');for(let i=0;i<14;i++){const dl=Math.random()*1.1;tone(300+Math.random()*500,200,.08,'triangle',.18,dl);noise(.05,.2,2500,800);}tone(80,30,1.2,'sine',.5);}
  else if(k==='whoosh')noise(.35,.2,400,2500);
  else if(k==='tick')woodTick(.5);
  else if(k==='no')tone(140,110,.15,'square',.1);
  else if(k==='win'){tone(523,523,.15,'square',.1);setTimeout(()=>tone(659,659,.15,'square',.1),130);setTimeout(()=>tone(784,784,.35,'square',.1),260);}
}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};

/* ---- デバッグ・テスト用 ---- */
window.G={screenOf(i,dy=0){const v=pieces[i].obj.position.clone();v.y+=pieces[i].s.half.y;v.project(camera);return [(v.x+1)/2*innerWidth,(1-v.y)/2*innerHeight+dy];},raw(){for(const p of pieces){p.obj.position.copy(p.s.pos);p.obj.quaternion.copy(p.s.quat);}updateCam(.5);renderer.render(scene,camera);},get pieces(){return pieces},get settleSteps(){return settleSteps},get held(){return held},get dbg(){return {turnEnding,failed,calmT,authority,turn}},get phase(){return phase},cam,
  tick(n=1,dt=1/60){for(let i=0;i<n;i++)step(dt);},
  info(){return {phase,turn,wobble,takenN,combo,score,tension,placing:!!placing}},
  grab(i,dx,dz,frames=120){const p=pieces[i];const pt=p.obj.position.clone();pt.y+=p.s.half.y;
    ptrs.set(-1,{x:0,y:0,role:'grab'});startGrab(p,pt,-1);
    // dx,dz: world target offset applied through plane projection
    held.dbg=true;const tgt=new THREE.Vector3(pt.x+dx,pt.y,pt.z+dz);
    const orig=rayPlaneY;
    for(let f=0;f<frames;f++){const k=Math.min(1,f/(frames*.6));held.tgtOverride=tgt.clone().lerp(pt,1-k);G._ov=held.tgtOverride;step(1/60);}
    },
  start(m,d,s=true){cfgMode=m;cfgDiff=d;solo=s;online=false;isHost=true;startMatch();}};
</script>
